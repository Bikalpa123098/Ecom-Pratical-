services:
  mongodb:
    image: mongo:7
    container_name: bikalpa-mongodb
    restart: unless-stopped
    # Prisma's MongoDB connector requires a replica set, even for single-node.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - bikalpa-mongo-data:/data/db
    healthcheck:
      test: "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"127.0.0.1:27017\"}]}).ok }'"
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bikalpa-mongo-data:
